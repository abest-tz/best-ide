name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: node esbuild.mjs --production
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
      - name: Azure login (Entra OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath *.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-ide-agent-vsix
          path: '*.vsix'
